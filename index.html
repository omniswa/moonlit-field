<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Moonlit Field - Clicker Farming Game</title>
  </head>
  <body>
    <section class="wrapper">
      <header>
        <section class="stats">
          <p>Coins: <span id="coins">100</span></p>
          <p>Lv. <span id="level">1</span></p>
        </section>
        <section class="level">
          <p>
            Exp: <span id="currentExp">0</span> /
            <span id="targetExp">100</span>
          </p>
        </section>
      </header>

      <main>
        <section class="plots">
          <span class="plot" id="plot1"></span>
          <span class="plot" id="plot2"></span>
          <span class="plot" id="plot3"></span>
          <span class="plot" id="plot4"></span>
          <span class="plot" id="plot5"></span>
          <span class="plot" id="plot6"></span>
          <span class="plot" id="plot7"></span>
          <span class="plot" id="plot8"></span>
          <span class="plot" id="plot9"></span>
        </section>
      </main>

      <footer>
        <span>CROPS</span>
        <span>SHOP</span>
        <span>QUESTS</span>
        <span>TOWN</span>
      </footer>
    </section>
    <script src="script.js"></script>
  </body>
</html>
